services:
  # ===========================================================================
  # 1. APACHE KAFKA 3.9 (KRaft Mode — No ZooKeeper) — localhost:9092
  # ===========================================================================
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9092}
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: "${KAFKA_HEAP_OPTS:--Xmx320m -Xms192m}"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  # ===========================================================================
  # 2. POSTGRESQL 16 — Data Warehouse (Star Schema · Gold Layer) — localhost:5432
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-er_admin}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-er_password}"
      POSTGRES_DB: "${POSTGRES_DB:-er_data_warehouse}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-er_admin} -d ${POSTGRES_DB:-er_data_warehouse}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ===========================================================================
  # 3. APACHE SPARK 3.5.3 CLUSTER (Master :8082 / Worker :8083 + /opt/venv)
  #    Silver Layer — Cleaning & Transformation
  # ===========================================================================
  spark-master:
    build:
      context: .
      dockerfile: Dockerfile.spark
    image: local/spark-venv:3.5.3
    container_name: spark-master
    ports:
      - "${SPARK_MASTER_UI_PORT:-8082}:8080"
      - "${SPARK_MASTER_PORT:-7077}:7077"
    environment:
      SPARK_DAEMON_MEMORY: 256m
      SPARK_NO_DAEMONIZE: "true"
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    volumes:
      - ./spark/jobs:/opt/spark-jobs
      - ./spark/streaming:/opt/spark-streaming
      - ./data/bronze:/opt/data/bronze
      - ./data/silver:/opt/data/silver
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  spark-worker:
    build:
      context: .
      dockerfile: Dockerfile.spark
    image: local/spark-venv:3.5.3
    container_name: spark-worker
    depends_on:
      spark-master:
        condition: service_healthy
    ports:
      - "${SPARK_WORKER_UI_PORT:-8083}:8081"
    environment:
      SPARK_DAEMON_MEMORY: 256m
      SPARK_WORKER_MEMORY: "${SPARK_WORKER_MEMORY:-512m}"
      SPARK_WORKER_CORES: "${SPARK_WORKER_CORES:-2}"
      SPARK_NO_DAEMONIZE: "true"
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --webui-port
      - "8081"
      - --memory
      - "${SPARK_WORKER_MEMORY:-512m}"
      - --cores
      - "${SPARK_WORKER_CORES:-2}"
    volumes:
      - ./spark/jobs:/opt/spark-jobs
      - ./spark/streaming:/opt/spark-streaming
      - ./data/bronze:/opt/data/bronze
      - ./data/silver:/opt/data/silver
    restart: unless-stopped

  # ===========================================================================
  # 4. APACHE SPARK STREAMING (Structured Streaming & DStreams + Kafka JARs)
  #    Bronze Layer Ingestion — Raw Data → Parquet
  # ===========================================================================
  spark-streaming:
    build:
      context: .
      dockerfile: Dockerfile.spark
    image: local/spark-venv:3.5.3
    container_name: spark-streaming
    depends_on:
      kafka:
        condition: service_healthy
      spark-master:
        condition: service_healthy
    ports:
      - "${SPARK_STREAMING_UI_PORT:-4040}:4040"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPARK_MASTER_URL: spark://spark-master:7077
      STREAMING_JOB: "${STREAMING_JOB:-}"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "[Spark Streaming] Active Python venv: $$(which python) ($$(python --version))"
        if [ -n "$${STREAMING_JOB}" ] && [ -f "/opt/spark-streaming/$${STREAMING_JOB}" ]; then
          echo "[Spark Streaming] Starting streaming job: /opt/spark-streaming/$${STREAMING_JOB}"
          exec /opt/spark/bin/spark-submit \
            --master spark://spark-master:7077 \
            --conf spark.ui.port=4040 \
            "/opt/spark-streaming/$${STREAMING_JOB}"
        else
          echo "[Spark Streaming] Environment ready (Kafka=kafka:29092, Master=spark://spark-master:7077)."
          echo "[Spark Streaming] Place streaming scripts in ./spark/streaming and submit via spark-submit."
          exec tail -f /dev/null
        fi
    volumes:
      - ./spark/streaming:/opt/spark-streaming
      - ./spark/jobs:/opt/spark-jobs
      - ./data/bronze:/opt/data/bronze
      - ./data/silver:/opt/data/silver
      - spark_checkpoints:/tmp/spark-checkpoints
    healthcheck:
      test: ["CMD-SHELL", "test -x /opt/venv/bin/python && test -f /opt/spark/jars/spark-sql-kafka-0-10_2.12-3.5.3.jar"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ===========================================================================
  # 5. APACHE AIRFLOW 2.10.4 (Orchestrator UI :8088 — admin / admin)
  # ===========================================================================
  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    image: local/airflow-venv:2.10.4
    container_name: airflow
    depends_on:
      kafka:
        condition: service_healthy
      spark-master:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "${AIRFLOW_UI_PORT:-8088}:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://${POSTGRES_USER:-er_admin}:${POSTGRES_PASSWORD:-er_password}@postgres:5432/${AIRFLOW_DB:-airflow}"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__WORKERS: "1"
      AIRFLOW__WEBSERVER__SECRET_KEY: "${AIRFLOW_SECRET_KEY:-spark-kafka-airflow-dev-secret}"
      AIRFLOW_CONN_SPARK_DEFAULT: "spark://spark-master:7077"
      AIRFLOW_CONN_KAFKA_DEFAULT: '{"conn_type":"kafka","extra":{"bootstrap.servers":"kafka:29092","group.id":"airflow-group","security.protocol":"PLAINTEXT"}}'
      AIRFLOW_CONN_POSTGRES_DEFAULT: "postgresql://${POSTGRES_USER:-er_admin}:${POSTGRES_PASSWORD:-er_password}@postgres:5432/${POSTGRES_DB:-er_data_warehouse}"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./spark/jobs:/opt/spark-jobs
      - ./spark/streaming:/opt/spark-streaming
      - ./data/bronze:/opt/data/bronze
      - ./data/silver:/opt/data/silver
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        airflow db migrate &&
        airflow users create \
          --username "${AIRFLOW_ADMIN_USER:-admin}" \
          --password "${AIRFLOW_ADMIN_PASSWORD:-admin}" \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@local.dev || true
        airflow scheduler &
        exec airflow webserver --port 8080 --workers 1
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
    restart: unless-stopped

  # ===========================================================================
  # 6. GRAFANA 11 — Data Visualization, Monitoring & Alerting — localhost:3000
  # ===========================================================================
  grafana:
    image: grafana/grafana:11.4.0
    container_name: grafana
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_INSTALL_PLUGINS: ""
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    restart: unless-stopped

volumes:
  spark_checkpoints:
  postgres_data:
  grafana_data:
